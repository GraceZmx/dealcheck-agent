# 线上防刷保护（防止有人刷光 DeepSeek 余额）。计数存在服务器内存里，服务重启后清零；
# 最后一道保险是 DeepSeek 账户只保留少量余额。

per_ip_agent_evaluations_per_day: 5   # 每个 IP 每天的 Agent 评估次数，超出后降级为仅规则模式
global_daily_cost_cny: 5.0            # 全站每天的 Agent 总花费上限（人民币），超出后全站降级
per_ip_requests_per_minute: 30        # 每个 IP 每分钟的 /api 请求数，超出返回 429
reserve_cost_cny_per_evaluation: 0.50 # 评估开始时先按单次上限预留，结束后按实际花费结算，防止并发请求一起冲过上限
# 真实客户端 IP 的来源（部署后用 DEBUG_IP=true 打开 /api/debug/ip，实测伪造请求头后再确定）：
# client_ip_header 为空时，从 X-Forwarded-For 右数第 trusted_proxy_hops 个；
# 填写请求头名（如 true-client-ip）时直接读取该请求头（仅当代理会覆盖该请求头时才安全）。
trusted_proxy_hops: 1
client_ip_header: ""
